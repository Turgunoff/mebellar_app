# Brand mark matches `AppSplashScreen` (terracotta disc + white cabinet glyph)
# and the adaptive launcher icon. Regenerate after edits:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FAFAFA"
  color_dark: "#121212"

  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png

  android: true
  ios: true

  android_12:
    color: "#FAFAFA"
    color_dark: "#121212"
    image: assets/images/splash_logo.png
    image_dark: assets/images/splash_logo.png

  android_gravity: center
  ios_content_mode: center
  fullscreen: false
