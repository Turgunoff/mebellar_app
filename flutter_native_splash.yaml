# Native splash is COLOR ONLY — the brand mark lives on Flutter's
# `AppSplashScreen` (animated terracotta disc + "Woody"). Keeping the OS
# launch screen logo-free avoids a blurry/double-logo flash before Flutter
# paints, and keeps Android + iOS identical:
#
#   OS launch  →  solid #FAFAFA / #121212
#               →  Flutter `AppSplashScreen` (logo + wordmark)
#               →  CustomerApp / SellerApp
#
# After edits: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FAFAFA"
  color_dark: "#121212"

  android: true
  ios: true

  android_12:
    color: "#FAFAFA"
    color_dark: "#121212"

  android_gravity: center
  ios_content_mode: center
  fullscreen: false
