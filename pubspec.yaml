name: woody_app
description: "Woody — Mebel do'koni"
publish_to: "none"
version: 1.0.20+20

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_bloc: ^9.0.0
  # Event transformers (restartable / droppable) for the B.7 performance pass.
  bloc_concurrency: ^0.3.0
  get_it: ^8.0.0
  equatable: ^2.0.8

  # Testable time — `clock.now()` in place of `DateTime.now()` so tests can
  # pin "now" with `withClock(...)` instead of waiting on the wall clock
  # (ROADMAP B.5 test-coverage baseline).
  clock: ^1.1.1

  # Routing
  go_router: ^14.6.0

  # Native OS share sheet (product share) + the first-launch flag that gates
  # the deferred deep-link clipboard trick (see core/deeplink/).
  share_plus: ^12.0.2
  shared_preferences: ^2.3.0

  # Networking
  dio: ^5.7.0
  http: ^1.2.2
  # WebSocket client for the Woody realtime fan-out (`wss://api.woody.uz/api/v1/realtime/ws`).
  web_socket_channel: ^3.0.1

  # Push notifications — FCM topic-based broadcasts + per-token personal
  # pushes. The device subscribes to the `news` topic on launch and saves
  # its FCM token to `device_tokens` after sign-in so the backend can fan
  # out personal pings.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Crash + non-fatal error reporting. Firebase Crashlytics replaces the
  # previous Sentry integration — it's free (unlimited events), ships ANR
  # detection on Android, and lives in the same dashboard as the
  # existing Firebase setup (Messaging, Auth). Talker errors are
  # forwarded to it via CrashlyticsTalkerObserver.
  firebase_crashlytics: ^4.1.5
  # Product analytics — funnel + retention + conversion. Free, unlimited.
  # Crashlytics consumes Analytics breadcrumbs ("user did X, Y, Z before
  # the crash") which is the killer feature of pairing the two.
  firebase_analytics: ^11.3.5
  # Required to display a notification banner when an FCM push arrives
  # while the app is in the foreground — Android only auto-shows pushes
  # in the system tray when the app is backgrounded or killed.
  flutter_local_notifications: ^18.0.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.0

  # App lifecycle
  flutter_phoenix: ^1.1.1

  # In-app updates — Google Play's native update prompts (immediate = blocking
  # full-screen, flexible = background download). Android-only; iOS no-ops.
  # Driven by the `app_versions` RemoteConfig key (backend `app_settings`).
  in_app_update: ^4.2.3
  # Reads the installed versionName at runtime so the update gate can compare
  # it against the backend-published min_version.
  package_info_plus: ^8.1.0

  # Localization — translations live in pure Dart (lib/core/i18n/) so
  # Shorebird code-push can ship copy edits OTA. intl stays for
  # NumberFormat / DateFormat helpers.
  intl: ^0.20.2

  # Images
  cached_network_image: ^3.4.1
  # `flutter_cache_manager` is the disk-cache backend behind
  # `cached_network_image`. Pinned explicitly so `performLogout` can call
  # `DefaultCacheManager().emptyCache()` — the helper isn't re-exported by
  # `cached_network_image`, so relying on the transitive resolution would
  # break the import.
  flutter_cache_manager: ^3.4.1
  # Direct dependency (already transitive via flutter_cache_manager) so the
  # cache size/clear service can read `getTemporaryDirectory()`.
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  image: ^4.3.0
  flutter_image_compress: ^2.3.0
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0

  # AR / 3D pipeline (Photos-to-3D via Meshy).
  #  - camera: custom locked-down 3-photo scan UI (no OS camera app).
  #  - flutter_image_compress (declared above): shrink each photo before upload.
  #  - model_viewer_plus: buyer-side <model-viewer> for the approved .glb,
  #    scaled true-to-size from the product's real-world dimensions.
  camera: ^0.11.0
  model_viewer_plus: ^1.9.3
  # Pulled in directly (already transitive via model_viewer_plus) so the buyer
  # AR viewer can hold a `WebViewController` and run JS against the
  # <model-viewer> canvas to capture a screenshot for "save to gallery".
  webview_flutter: ^4.13.0
  # Save the watermarked AR screenshot straight to the device camera roll.
  # `gal` is the maintained MediaStore / PHPhotoLibrary plugin (Dart 3) — the
  # PlatformView (WebView) can't be captured via RepaintBoundary, so the shot
  # is read from the WebGL canvas instead and written here.
  gal: ^2.3.2

  # Typography — fonts are declared natively under `flutter.fonts` below.
  # The `google_fonts` package was previously used; it's no longer needed
  # because every TTF is bundled under `assets/google_fonts/` and looked up
  # by Flutter's built-in font loader via the family constants in
  # `lib/core/theme/app_fonts.dart`.

  # Icons
  iconsax_flutter: ^1.0.0

  # Lottie animations (AI loading overlay)
  lottie: ^3.1.2

  # Masonry / staggered grid layout
  flutter_staggered_grid_view: ^0.7.0

  # Charts
  fl_chart: ^0.69.0

  # External actions (tel:, telegram links)
  url_launcher: ^6.3.1

  # Native App Store / Play Store in-app review prompt. Triggered at a "happy
  # moment" — right after a customer leaves a 4-5★ product review — so the OS
  # rating dialog appears without leaving the app. The OS rate-limits it, so a
  # request is a no-op when shown recently / in debug.
  in_app_review: ^2.0.10

  # Maps & location
  yandex_mapkit: ^4.2.1
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  mask_text_input_formatter: ^2.9.0

  # Logging
  talker_flutter: ^5.1.16

  # Support chat voice notes. `record` captures mic audio (AAC-LC → .m4a,
  # content_type audio/mp4); `just_audio` plays back the resulting clips +
  # admin voice replies with a play/pause + seek bar.
  record: ^5.1.2
  just_audio: ^0.9.42

  # Connectivity — connectivity_plus detects link changes (wifi / cellular /
  # none), internet_connection_checker_plus verifies actual reachability so
  # the offline banner doesn't lie when the device is on a captive wifi that
  # has no internet.
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.2
  smart_auth: ^3.2.0

dependency_overrides:
  # `record` 5.2.1 pins `record_linux` to `<1.0.0`, which resolves to the
  # ancient 0.7.2 — that build predates `record_platform_interface` 1.6.0
  # (it's missing `startStream` and the new `hasPermission` signature), so a
  # compile fails even though Linux is not a target. Force the matching
  # `record_linux` 1.3.1 (implements platform_interface ^1.5.0); the mobile
  # runtime uses record_android / record_darwin, so this only satisfies the
  # resolver/analyzer.
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # End-to-end happy-path test harness (ROADMAP B.5). Runs from
  # `integration_test/` via `flutter test integration_test` on a device.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4
  # Test-only: a no-op WebViewPlatform fake so model_viewer_plus (the buyer-side
  # AR viewer) can mount in the flutter_test harness, where no platform plugin
  # is registered. Pulled in transitively by webview_flutter at runtime.
  webview_flutter_platform_interface: ^2.13.0

# Generated iOS/Android launcher icons from a single 1024×1024 master.
# Run after changes:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  # iOS + legacy ic_launcher.png use the FULL icon (terracotta bg + white box
  # baked in) so the pre-adaptive Android (<8) launcher and iOS both show the
  # finished icon, not a bare glyph on transparency. Adaptive (8+) composes the
  # bg colour + the transparent white foreground below instead.
  image_path: "design/logo/woody_logo_full.png"
  min_sdk_android: 21
  # Apple App Store rejects icons with an alpha channel — flatten the iOS
  # variant against the terracotta brand background instead of leaving it
  # transparent. One unified icon: NO iOS dark/tinted appearance variants
  # (removed on purpose for strict brand consistency).
  remove_alpha_ios: true
  background_color_ios: "#C27A5F"
  # Adaptive icon (Android 8+): terracotta background + white cabinet foreground
  # with the safe-zone padding pre-baked into woody_logo_foreground.png.
  adaptive_icon_background: "#C27A5F"
  adaptive_icon_foreground: "assets/logo/woody_logo_foreground.png"
  # Themed icons (Android 13+): the system tints this silhouette to match
  # the user's wallpaper, so colour is dropped here on purpose.
  adaptive_icon_monochrome: "assets/logo/woody_logo_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/google_fonts/
    - assets/lottie/
    - shorebird.yaml

  # Native Flutter font registration — replaces the `google_fonts` package.
  # Every family/weight referenced via `AppFonts.*` in the code points back
  # to one of these TTFs. To add a new weight, drop the file into
  # `assets/google_fonts/` and append it here under the matching family.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/google_fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: PlayfairDisplay
      fonts:
        - asset: assets/google_fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/google_fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
