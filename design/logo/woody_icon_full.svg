<?xml version="1.0" encoding="UTF-8"?>
<!-- Full Woody icon: solid terracotta background + WHITE cabinet glyph — the
     unified brand mark used everywhere (Android legacy ic_launcher.png + the
     iOS AppIcon, single appearance). Source for woody_logo_full.png (the FLI
     image_path) and the 512x512 Google Play listing icon. Mirrors the launcher
     composition (terracotta bg + ~65% glyph) so the store icon matches the
     device. Terracotta #C27A5F = the CLAUDE.md brand accent (kTerracotta). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" fill="#C27A5F"/>
  <g transform="translate(50,50) scale(0.8) translate(-50,-50)">
    <rect x="13" y="13" width="74" height="74" rx="19" fill="none"
          stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <line x1="13" y1="38" x2="87" y2="38"
          stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <rect x="37" y="56.5" width="26" height="11" rx="5.5" fill="#FFFFFF"/>
  </g>
</svg>
