<?xml version="1.0" encoding="UTF-8"?>
<!-- Android notification small icon: a flat WHITE silhouette on transparent.
     The status bar renders only the alpha shape (tinted by the system), so a
     full-colour launcher icon would show as a white square — this is the fix.
     Glyph fills ~81% (less padding than the launcher) since it isn't masked. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 100 100">
  <rect x="13" y="13" width="74" height="74" rx="19" fill="none"
        stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
  <line x1="13" y1="38" x2="87" y2="38"
        stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <rect x="37" y="56.5" width="26" height="11" rx="5.5" fill="#FFFFFF"/>
</svg>
