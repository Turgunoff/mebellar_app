<?xml version="1.0" encoding="UTF-8"?>
<!-- iOS 18 "Dark Appearance" master: deep near-black navy background + the same
     terracotta cabinet glyph. Distinct from woody_icon_full.svg (light/any),
     which uses the lighter #1F2933 brand navy. Apple composites this on the
     dark home-screen plate; we bake an opaque dark background (the task's
     "dark background variant") so the icon keeps its brand depth. Same glyph
     geometry + safe-zone scale as the light/foreground/monochrome masters. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" fill="#11181F"/>
  <g transform="translate(50,50) scale(0.8) translate(-50,-50)">
    <rect x="13" y="13" width="74" height="74" rx="19" fill="none"
          stroke="#C2703D" stroke-width="7" stroke-linejoin="round"/>
    <line x1="13" y1="38" x2="87" y2="38"
          stroke="#C2703D" stroke-width="7" stroke-linecap="round"/>
    <rect x="37" y="56.5" width="26" height="11" rx="5.5" fill="#C2703D"/>
  </g>
</svg>
