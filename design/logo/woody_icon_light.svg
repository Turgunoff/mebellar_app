<?xml version="1.0" encoding="UTF-8"?>
<!-- iOS 18 "Any / Light Appearance" master: WHITE background + terracotta
     cabinet glyph. A bright icon distinct from the dark home screen — the
     navy-baked woody_icon_full.svg (still the Android legacy + FLI source)
     read as dark in light mode, which is the bug this fixes. The glyph keeps
     the brand terracotta #C2703D for clear contrast on white. Same glyph
     geometry + safe-zone scale as the dark / foreground / monochrome masters. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <rect x="0" y="0" width="100" height="100" fill="#FFFFFF"/>
  <g transform="translate(50,50) scale(0.8) translate(-50,-50)">
    <rect x="13" y="13" width="74" height="74" rx="19" fill="none"
          stroke="#C2703D" stroke-width="7" stroke-linejoin="round"/>
    <line x1="13" y1="38" x2="87" y2="38"
          stroke="#C2703D" stroke-width="7" stroke-linecap="round"/>
    <rect x="37" y="56.5" width="26" height="11" rx="5.5" fill="#C2703D"/>
  </g>
</svg>
